# ─────────────────────────────────────────────────────────────
# PVC — db.json 영속화용
# 컨테이너 재시작마다 예약 데이터가 초기화되지 않도록 /data(db.json)를 PVC로 마운트.
# storageClassName 미지정 → 클러스터 기본 StorageClass 사용(CultureLog MySQL과 동일 패턴).
# ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kopo12-hotel-reservation-data
  namespace: hotel-reservation
  labels:
    app: kopo12-hotel-reservation
spec:
  accessModes:
    - ReadWriteOnce              # 단일 파드 전용(표준)
  resources:
    requests:
      storage: 1Gi
