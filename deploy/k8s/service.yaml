# ─────────────────────────────────────────────────────────────
# Service — Ingress/Traefik 트래픽을 Deployment 로 전달
# ClusterIP(클러스터 내부 전용) — 외부 노출은 Ingress 가 담당.
# ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: kopo12-hotel-reservation
  namespace: hotel-reservation
  labels:
    app: kopo12-hotel-reservation
spec:
  type: ClusterIP
  selector:
    app: kopo12-hotel-reservation        # deployment pod label 과 일치
  ports:
    - name: http
      port: 3000
      targetPort: 3000
