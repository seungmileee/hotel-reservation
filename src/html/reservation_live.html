<!-- 실시간 예약 - 객실 선택 페이지(STANDARD/DELUXE/PREMIUM/SWEET 진입) -->
<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>reservation</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/page/reservation_live.css" />
    <script src="https://kit.fontawesome.com/ffec4fd550.js" crossorigin="anonymous"></script>
    <script type="module" src="../js/component/my_header.js"></script>
    <script type="module" src="../js/component/my_footer.js"></script>
    <script type="module" src="../js/component/to_the_top.js"></script>
    <script type="module" src="../js/component/my_banner.js"></script>
  </head>
  <body>
    <my-header></my-header>
    <my-banner title="RESERVATION" content="실시간예약" image="../assets/img/reservation_var/reservation_live.jpg"></my-banner>
    <div class="container">
      <h3 class="reservation-title">객실 선택</h3>
      <div class="room-link-container">
        <a href="room_detail.html?room=standard" class="room-link-wrapper">
          <img src="../assets/img/reservation_select/standard.jpg" />
          <div class="room-link-content">
            <h3>STANDARD &nbsp; <i class="fa-solid fa-arrow-right-long"></i></h3>
          </div>
        </a>
        <a href="room_detail.html?room=deluxe" class="room-link-wrapper">
          <img src="../assets/img/reservation_select/deluxe.jpg" />
          <div class="room-link-content">
            <h3>DELUXE &nbsp; <i class="fa-solid fa-arrow-right-long"></i></h3>
          </div>
        </a>
        <a href="room_detail.html?room=premium" class="room-link-wrapper">
          <img src="../assets/img/reservation_select/premium.jpg" />
          <div class="room-link-content">
            <h3>PREMIUM &nbsp; <i class="fa-solid fa-arrow-right-long"></i></h3>
          </div>
        </a>
        <a href="room_detail.html?room=sweet" class="room-link-wrapper">
          <img src="../assets/img/reservation_select/sweet.jpg" />
          <div class="room-link-content">
            <h3>SWEET &nbsp; <i class="fa-solid fa-arrow-right-long"></i></h3>
          </div>
        </a>
      </div>
      <div class="provision-container">
        <div class="provision-title">취소 및 환불 규정</div>
        <div class="provision-content">
          <div>
            <p>숙박 예정일 1일 전 18시까지는 위약금 없이 취소 및 변경이 가능합니다.</p>
          </div>
          <div class="provision-content-long">
            <p>숙박 예정일 1일 전 18시 이후 취소/변경 및 노쇼(No-show) 발생 시,</p>
            <p>- 성수기 : 최소 1일 숙박 요금의 80%가 위약금으로 부과됩니다.</p>
            <p>- 비수기(성수기 외 기간) : 최소 1일 숙박 요금의 10%가 위약금으로 부과됩니다.</p>
          </div>
          <div>
            <p>일부 패키지의 경우 별도의 취소규정이 적용됩니다.</p>
          </div>
        </div>
      </div>
    </div>
    <my-footer></my-footer>
    <to-the-top></to-the-top>
  </body>
</html>
