<!-- 실시간 예약 - 객실 상세 페이지 (달력 / ?room=standard 파라미터로 4종 객실 커버) -->
<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>reservation</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/page/room_detail.css" />
    <script src="https://kit.fontawesome.com/ffec4fd550.js" crossorigin="anonymous"></script>
    <script type="module" src="js/component/my_header.js"></script>
    <script type="module" src="js/component/my_footer.js"></script>
    <script type="module" src="js/component/to_the_top.js"></script>
    <script type="module" src="js/component/my_banner.js"></script>
  </head>
  <body>
    <my-header></my-header>
    <my-banner title="RESERVATION" content="실시간예약" image="assets/img/reservation_var/reservation_live.jpg"></my-banner>
    <div class="container">
      <h3 id="room-title" class="reservation-title"></h3>
      <div class="detail-container">
        <div class="image-section">
          <div class="main-img-viewport">
            <div class="main-img-track" id="main-img-track"></div>
          </div>
          <div class="thumbnail-list"></div>
        </div>
        <div class="calendar-section">
          <div class="calendar-header">
            <button id="prev-month"><</button>
            <span id="current-month"></span>
            <button id="next-month">></button>
          </div>
          <div class="weekdays">
            <div>일</div>
            <div>월</div>
            <div>화</div>
            <div>수</div>
            <div>목</div>
            <div>금</div>
            <div>토</div>
          </div>
          <div class="days" id="days"></div>
          <div class="guest-row">
            <span>추가 인원</span>
            <div class="select-box" id="select-box">
              <button type="button" class="select-btn" id="select-btn">
                <span id="select-label">없음</span>
                <i class="fa-solid fa-chevron-down"></i>
              </button>
              <ul class="select-list" id="select-list"></ul>
            </div>
            <p class="guest-info"></p>
          </div>
          <div class="total-row">
            <span>총 합계</span>
            <span><span id="total-price">0</span>원</span>
          </div>
          <div class="btn-row">
            <button id="cancel-btn">취소</button>
            <button id="reserve-btn">예약하기</button>
          </div>
        </div>
      </div>
      <div class="desc-section">
        <p id="desc"></p>
        <p id="desc-eng"></p>
      </div>
    </div>
    <my-footer></my-footer>
    <to-the-top></to-the-top>
    <div class="modal" id="alert-modal">
      <div class="modal-box">
        <p id="modal-text"></p>
        <button id="modal-close">확인</button>
      </div>
    </div>
    <script src="js/page/room_detail.js"></script>
  </body>
</html>
